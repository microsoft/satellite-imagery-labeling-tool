<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; script-src 'self' https://atlas.microsoft.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://atlas.microsoft.com; font-src 'self' https://atlas.microsoft.com; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; frame-src 'none'; form-action 'self'"/>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="shortcut icon" href="./assets/earth.ico"/>
	<link rel="stylesheet" href="libs/material-symbols/outlined.css"/>
    <script src="modules/localServerGuidance.js" defer></script>
    
	<title>Spatial imagery labeling project viewer</title>

	<!-- Add Azure Maps CSS files. -->
	<link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" integrity="sha384-59ojKv+oBxaGUcP1dK+iHONfFFO09inCib+Zg2wV6WXmAJwinV4bp+hQ1s4HU0g6" crossorigin="anonymous"/>
	<link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/drawing/1/atlas-drawing.min.css" integrity="sha384-0aMUOBPV5vyPlTfGQjpTxMKef45D6FZbzhB3Im4IBb+4lEUGNo7AYu7J3jywnBsI" crossorigin="anonymous"/>

	<!-- Add App CSS files. -->
	<link rel="stylesheet" href="css/themes/indigo.css"/>
	<link rel="stylesheet" href="css/layout.css"/>
    <link rel="stylesheet" href="css/dialogs.css"/>
	<link rel="stylesheet" href="css/projectViewer.css"/>
</head>
<body>
	<header>
		<h1 id="appTitle">Spatial imagery labeling project viewer</h1>

        <button id="helpBtn" title="Help" class="text-btn-round"><i class="material-symbols-outlined">question_mark</i></button>

		<a class="text-btn-round" href="projectBuilder.html" target="_blank">Open project builder</a>
	</header>

	<div class="main w3-row">
	  	<div class="side-panel">     
            <input type="file" id="loadLocalProjectFile" accept=".zip"/>
            <button id="loadProjectBtn" class="text-btn-round">Load existing project</button>

            <button id="exportBtn" class="text-btn-round">Merge and export results</button>

            <hr/>
            <br/><br/>
            <label>View: <select id="focusSelector">
                <option value="tasks">Task area stats</option>
                <option value="primary">Primary class results</option>
                <option value="secondary" disabled>Secondary class results</option>
            </select></label>  

            <br/><br/>
            <label>Project stats</label>
            <br/><br/>
            <div id="statsPanel"></div>
      	</div>
	  	<div class="main-content">
			<div id="myMap"></div>
		</div>
	</div>

	<!-- Add Azure Maps libraries -->
	<script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js" integrity="sha384-9/rcXx8mMp2NSsvBG2dGqmp1mvka1Th6mKwswKVg1KmLwaj+oScWpZBF6u6Waejb" crossorigin="anonymous"></script>
    <script src="https://atlas.microsoft.com/sdk/javascript/drawing/1/atlas-drawing.min.js" integrity="sha384-hSbiDCEvgwFU7fM+sPrh7qXUW8sML+ngq+ax0n3lqflMDtAg6giLXAOsnvJ3oZjr" crossorigin="anonymous"></script>
    <script src="https://atlas.microsoft.com/sdk/javascript/spatial/0/atlas-spatial.min.js" integrity="sha384-I45x3rkxF55Pva8mnkoEa3U6JSKO7aoL6H/qYeqMuFcJ96k0QOH6ZAp6oLd1tMEq" crossorigin="anonymous"></script>
	
	<!-- Add 3rd party libraries libraries -->
	<script src="libs/azure-maps-image-exporter.min.js"></script>  
	<script src="libs/marked.min.js"></script>
	<script src="libs/purify.min.js"></script>
    <script src="libs/jszip.min.js"></script>

	<script type="module" src="modules/projectViewerBootstrap.js"></script>
</body>
</html>
